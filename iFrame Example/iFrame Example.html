<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Defualt Borders</p>
    <iframe src="Page1.html" frameborder="1"></iframe>
    <iframe src="Page2.html" frameborder="1"></iframe>
    <br>
    <br>
    <p>Borders Red</p>
    <iframe style="border:red 2px solid ; " src="Page1.html" frameborder="1"></iframe>
    <iframe style="border:red 2px solid ;" src="Page2.html" frameborder="1"></iframe>
    <br>
    <br>
    <p>Changing Width and Height</p>
    <iframe style="border:red 2px solid; height: 400px; width: 600px;" src="Page1.html" frameborder="1"></iframe>
    <iframe style="border:red 2px solid; height: 400px; width: 400px;" src="Page2.html" frameborder="1"></iframe>
    <br>
    <br>
    <p>No Borders</p>
    <iframe style="border:none; " src="Page1.html" frameborder="1"></iframe>
    <iframe style="border:none;" src="Page2.html" frameborder="1"></iframe>
    <br>
    <br>
    <p>ُExample Embedding Video</p>
    <iframe 
    width="560" height="315" 
    src="https://www.youtube.com/embed/sWCQMMfP8p8?si=UdtLtMALT1VF5h1B" title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
